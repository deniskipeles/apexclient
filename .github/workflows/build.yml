name: Build Android APKs

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# ── GRANT RELEASE PERMISSIONS TO GITHUB_TOKEN ──
permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # ── 1. CHECKOUT SOURCE CODE ──
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── 2. SETUP JAVA 17 ──
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 3. SETUP NODE.JS ──
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # ── 4. SETUP RUST TOOLCHAIN & ANDROID TARGETS ──
      - name: Setup Rust & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            x86_64-linux-android
            i686-linux-android

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      # ── 5. SETUP ANDROID NDK & SDK (PINNED TO STABLE NDK 26) ──
      - name: Setup Android NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

          # Select pre-installed NDK 26.x (avoid canary NDK 29)
          NDK_VERSION=$(ls "$ANDROID_HOME/ndk" | grep "^26\." | tail -n 1)
          if [ -z "$NDK_VERSION" ]; then
            NDK_VERSION=$(ls "$ANDROID_HOME/ndk" | grep "^25\." | tail -n 1)
          fi
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> $GITHUB_ENV
          echo "Pinned Stable NDK: $NDK_VERSION"

          # Fix Linux permission denied error for gradlew
          chmod +x src-tauri/gen/android/gradlew 2>/dev/null || true

      # ── 6. INSTALL NODE DEPENDENCIES ──
      - name: Install Dependencies
        run: npm ci || npm install

      # ── 7. RUN BUILD SCRIPT & PACKAGE APKS ──
      - name: Run Android Build & Auto-Signing
        env:
          KEY_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'apexclient123' }}
        run: |
          chmod +x ./build_android.sh
          chmod +x src-tauri/gen/android/gradlew 2>/dev/null || true
          ./build_android.sh

      # ── 8. UPLOAD INDIVIDUAL ARTIFACTS ──
      - name: Upload aarch64 APK
        uses: actions/upload-artifact@v4
        with:
          name: apexclient-aarch64
          path: dist-apk/apexclient-aarch64.apk
          if-no-files-found: warn

      - name: Upload armv7 APK
        uses: actions/upload-artifact@v4
        with:
          name: apexclient-armv7
          path: dist-apk/apexclient-armv7.apk
          if-no-files-found: warn

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: apexclient-x86_64
          path: dist-apk/apexclient-x86_64.apk
          if-no-files-found: warn

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: apexclient-universal
          path: dist-apk/apexclient-universal.apk
          if-no-files-found: warn

      # ── 9. CREATE GITHUB RELEASE (ON VERSION TAG PUSH) ──
      - name: Publish Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-apk/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}