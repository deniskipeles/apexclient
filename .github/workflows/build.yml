name: Build Android APKs

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # ── 1. CHECKOUT SOURCE CODE ──
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── 2. SETUP JAVA 17 ──
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 3. SETUP NODE.JS ──
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # ── 4. SETUP RUST TOOLCHAIN & ANDROID TARGETS ──
      - name: Setup Rust & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            x86_64-linux-android
            i686-linux-android

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      # ── 5. SETUP ANDROID NDK & SDK ──
      - name: Setup Android NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          # GitHub runners have NDK pre-installed in $ANDROID_HOME/ndk/
          NDK_VERSION=$(ls "$ANDROID_HOME/ndk" | sort -V | tail -n 1)
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> $GITHUB_ENV
          echo "Using Android NDK: $NDK_VERSION"

      # ── 6. INSTALL NODE DEPENDENCIES ──
      - name: Install Dependencies
        run: npm ci || npm install

      # ── 7. RUN BUILD SCRIPT & PACKAGE APKS ──
      - name: Run Android Build & Auto-Signing
        env:
          KEY_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'apexclient123' }}
        run: |
          chmod +x ./build_android.sh
          ./build_android.sh

      # ── 8. UPLOAD APKS AS ARTIFACTS ──
      - name: Upload Built APKs
        uses: actions/upload-artifact@v4
        with:
          name: apexclient-apks
          path: dist-apk/*.apk
          retention-days: 14

      # ── 9. CREATE GITHUB RELEASE (ON VERSION TAG PUSH) ──
      - name: Publish Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-apk/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}