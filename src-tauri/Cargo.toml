[package]
name = "apexclient"
version = "0.1.0"
description = "Lightweight ApexApp Client"
authors = ["kipeles"]
edition = "2021"

[lib]
name = "apexclient_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── STRIP 120MB+ OF DWARF DEBUG SYMBOLS ON RELEASE ──────────────────────────
[profile.release]
strip = true          # Automatically strips all debug symbols
opt-level = "z"       # Optimize aggressively for binary size
lto = true            # Link-time optimization across all crates
codegen-units = 1     # Maximizes size reduction and dead-code elimination
panic = "abort"       # Eliminates unwinding landing-pad tables
