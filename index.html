<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>ApexClient</title>
  <script type="module" src="/src/main.ts" defer></script>
</head>
<body>
  <div class="mobile-viewport">

    <!-- VIEW 1: APP HUB (App Manager) -->
    <div id="view-hub" class="view active">
      <header class="hub-header">
        <div class="brand">
          <span class="logo">⚡</span>
          <div>
            <h2>ApexClient</h2>
            <p>Workspaces & Terminals</p>
          </div>
        </div>
        <button id="btn-add-modal" class="btn-icon" title="Add App">+</button>
      </header>

      <main class="hub-content">
        <div id="app-grid" class="app-grid"></div>
      </main>
    </div>

    <!-- VIEW 2: ACTIVE IFRAME VIEWER -->
    <div id="view-app" class="view">
      <header class="app-bar">
        <button id="btn-back-hub" class="btn-icon-sm" title="Back to Hub">←</button>
        <div class="app-bar-meta">
          <span id="app-bar-title" class="title">Workshop POS</span>
          <span id="connection-badge" class="badge">Resolving...</span>
        </div>
        <button id="btn-refresh-frame" class="btn-icon-sm" title="Reload">↻</button>
      </header>

      <div class="iframe-box">
        <div id="app-loader" class="loader-overlay">
          <div class="spinner"></div>
          <p>Connecting to ApexApp...</p>
        </div>
        <iframe id="app-iframe" src="about:blank" allow="camera; microphone; geolocation"></iframe>
      </div>
    </div>

  </div>

  <!-- MODAL: ADD APP (MANUAL OR QR) -->
  <div id="modal-add" class="modal-backdrop" style="display:none;">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Connect to ApexApp</h3>
        <button id="btn-close-add" class="btn-close">✕</button>
      </div>

      <button id="btn-scan-qr" class="btn-cta-scan">
        <span style="font-size:1.4rem;">📷</span>
        <span>Scan Desktop QR Code</span>
      </button>

      <div class="separator"><span>OR ENTER MANUALLY</span></div>

      <form id="form-manual-add" class="modal-form">
        <label>App Name</label>
        <input id="inp-app-name" placeholder="e.g. Workshop Counter" required />

        <label>Local Wi-Fi IP (Fastest)</label>
        <input id="inp-app-local" placeholder="http://192.168.1.x:5000" />

        <label>Public Tunnel URL (Remote Access)</label>
        <input id="inp-app-remote" placeholder="https://trycloudflare.com or apexkit.io" />

        <button type="submit" class="btn-submit">Save Workspace</button>
      </form>
    </div>
  </div>

  <!-- MODAL: CAMERA SCANNER -->
  <div id="modal-scan" class="modal-backdrop" style="display:none;">
    <div class="scanner-card">
      <button id="btn-close-scanner" class="btn-scanner-close">✕</button>
      <div class="video-container">
        <video id="scanner-video" autoplay playsinline muted></video>
        <div class="scan-laser"></div>
      </div>
      <p class="scan-hint">Point camera at QR code on your computer</p>
    </div>
  </div>
</body>
</html>
