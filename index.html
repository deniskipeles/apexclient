<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  
  <!-- System Theme Color Adaptation -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#090d16" />
  <meta name="color-scheme" content="light dark" />

  <!-- iOS PWA / WebKit Shell Configuration -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>ApexClient</title>
  <script type="module" src="/src/main.ts" defer></script>
</head>
<body>
  <div class="mobile-viewport">

    <!-- VIEW 1: APP HUB (Native Mobile Card Deck) -->
    <div id="view-hub" class="view active">
      <header class="hub-header">
        <div class="brand">
          <div class="logo-badge">
            <img src="/src/assets/apex.svg" alt="Apex Logo" class="logo-badge-img" />
          </div>
          <div class="brand-text">
            <h2>ApexClient</h2>
            <p>Workspaces & POS Terminals</p>
          </div>
        </div>
        <button id="btn-add-modal" class="btn-icon" aria-label="Add App" title="Add App">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
      </header>

      <main class="hub-content">
        <div class="section-label">CONNECTED APPS</div>
        <div id="app-grid" class="app-grid"></div>
      </main>
    </div>

    <!-- VIEW 2: ACTIVE IFRAME VIEWER -->
      <div id="view-app" class="view">
        <header class="app-bar">
          <button id="btn-back-hub" class="nav-btn" aria-label="Back">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            <span>Hub</span>
          </button>
          
          <div class="app-bar-brand">
            <img id="app-bar-icon" class="app-bar-icon" style="display:none;" alt="" />
            <div class="app-bar-meta">
              <span id="app-bar-title" class="title">ApexApp</span>
              <span id="connection-badge" class="badge">Resolving...</span>
            </div>
          </div>

          <button id="btn-refresh-frame" class="btn-icon-sm" aria-label="Reload" title="Reload">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.5 2v6h-6M21.5 8a10 10 0 1 1-3.2-6.2l3.2 6.2z"/>
            </svg>
          </button>
        </header>

        <div class="iframe-box">
          <!-- 1. SPINNER OVERLAY -->
          <div id="app-loader" class="loader-overlay">
            <div class="native-spinner"></div>
            <p>Connecting to ApexApp...</p>
          </div>

          <!-- 2. CUSTOM NATIVE ERROR SCREEN (PREVENTS ANDROID SYSTEM WEBVIEW ERROR) -->
          <div id="app-error-view" class="error-overlay" style="display: none;">
            <div class="error-card">
              <div class="error-badge-icon">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M22.61 16.95A5 5 0 0 0 18 10h-1.26a8 8 0 0 0-7.05-6M5 5a8 8 0 0 0 4 15h9a5 5 0 0 0 1.7-.3"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </div>

              <h3 id="err-title">Workspace Offline</h3>
              <p id="err-desc" class="error-description">The server could not be reached.</p>

              <div class="error-url-box">
                <span class="url-label">ATTEMPTED ADDRESS</span>
                <code id="err-target-url">https://...</code>
              </div>

              <div class="error-actions">
                <button id="btn-err-retry" class="btn-cta-action">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21.5 2v6h-6M21.5 8a10 10 0 1 1-3.2-6.2l3.2 6.2z"/>
                  </svg>
                  <span>Retry Connection</span>
                </button>

                <button id="btn-err-scan-new" class="btn-secondary-action">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                    <circle cx="12" cy="13" r="4"></circle>
                  </svg>
                  <span>Scan New QR Code</span>
                </button>
              </div>
            </div>
          </div>

          <iframe id="app-iframe" src="about:blank" allow="camera; microphone; geolocation"></iframe>
        </div>
      </div>

  </div>

  <!-- NATIVE MOBILE BOTTOM SHEET: ADD APP -->
  <div id="modal-add" class="sheet-backdrop" style="display:none;">
    <div class="sheet-container">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <h3>Connect App</h3>
        <button id="btn-close-add" class="btn-sheet-close">✕</button>
      </div>

      <button id="btn-scan-qr" class="btn-cta-scan">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
          <circle cx="12" cy="13" r="4"></circle>
        </svg>
        <span>Scan Desktop QR Code</span>
      </button>

      <div class="separator"><span>OR ENTER MANUALLY</span></div>

      <form id="form-manual-add" class="sheet-form">
        <div class="input-group">
          <label>App Name</label>
          <input id="inp-app-name" placeholder="e.g. Counter POS" required />
        </div>

        <div class="input-group">
          <label>Local Wi-Fi Address (Fastest)</label>
          <input id="inp-app-local" type="url" placeholder="http://192.168.1.x:5000" />
        </div>

        <div class="input-group">
          <label>Public Tunnel URL (Remote Access)</label>
          <input id="inp-app-remote" type="url" placeholder="https://your-app.trycloudflare.com" />
        </div>

        <button type="submit" class="btn-submit">Save Workspace</button>
      </form>
    </div>
  </div>

  <!-- NATIVE OPTICAL CAMERA SCANNER -->
  <div id="modal-scan" class="scanner-backdrop" style="display:none;">
    <div class="scanner-header">
      <button id="btn-close-scanner" class="btn-scanner-close">✕</button>
      <span class="scanner-title">Scan QR Code</span>
      <div style="width: 36px;"></div>
    </div>
    
    <div class="viewfinder-container">
      <video id="scanner-video" autoplay playsinline muted></video>
      <div class="viewfinder-frame">
        <div class="corner top-left"></div>
        <div class="corner top-right"></div>
        <div class="corner bottom-left"></div>
        <div class="corner bottom-right"></div>
        <div class="laser-scanner"></div>
      </div>
    </div>
    <p class="scan-hint">Center the QR code from ApexApp desktop screen in the frame</p>
  </div>
</body>
</html>
